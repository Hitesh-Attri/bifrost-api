name: Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPO: nexus/bifrost-api
  ECS_CLUSTER: nexus-dev-cluster
  ECS_SERVICE: nexus-dev-bifrost-api
  NEXUS_INFRA_PATH: ${{ github.workspace }}/nexus-infra

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bifrost-api
        uses: actions/checkout@v4

      # Checked out to ./nexus-infra — available via $NEXUS_INFRA_PATH.
      # Use when you need to read nexus-infra Terraform outputs (e.g. ECS cluster
      # ARN, VPC IDs) instead of hardcoding them in this file.
      - name: Checkout nexus-infra
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NEXUS_INFRA_REPO }}
          path: nexus-infra
          token: ${{ secrets.NEXUS_INFRA_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/${{ env.ECR_REPO }}
          docker build -t $IMAGE:$SHA -t $IMAGE:latest .
          docker push $IMAGE:$SHA
          docker push $IMAGE:latest
          echo "image=$IMAGE:$SHA" >> $GITHUB_OUTPUT

      - name: Force ECS redeploy
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --query "service.serviceName" \
            --output text

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
